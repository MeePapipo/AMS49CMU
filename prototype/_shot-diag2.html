<!doctype html><html><head><meta charset="utf-8">
<style>body{font:13px/1.5 monospace;margin:0;padding:8px;background:#fff}
h2{font-size:14px;margin:10px 0 2px}.bad{color:#b00;font-weight:700}.ok{color:#070}
iframe{position:absolute;left:-9999px;width:768px;height:900px;border:0}</style></head><body>
<div id="out">measuring…</div>
<script>
var PAGES=['_shot-admin.html'];
var W=768, out=document.getElementById('out'), lines=[];
function step(i){
  if(i>=PAGES.length){out.innerHTML=lines.join('');return;}
  var f=document.createElement('iframe'); f.src=PAGES[i]+'?w=1'; document.body.appendChild(f);
  f.onload=function(){
    setTimeout(function(){
      var d=f.contentDocument, de=d.documentElement;
      try{ if(PAGES[i]==='admin.html'){ f.contentWindow.sessionStorage.setItem('ams49.admin','1'); } }catch(e){}
      var sw=Math.max(de.scrollWidth, d.body.scrollWidth);
      var over=sw>W+1;
      lines.push('<h2>'+PAGES[i]+' — scrollWidth <span class="'+(over?'bad':'ok')+'">'+sw+'</span> / '+W+'</h2>');
      if(over){
        var bad=[];
        d.querySelectorAll('*').forEach(function(el){
          var r=el.getBoundingClientRect();
          if(r.right>W+1 && r.width>0){
            var p=el.parentElement, pr=p?p.getBoundingClientRect():null;
            if(!pr || pr.right<=W+1){ bad.push(el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+(el.className&&el.className.baseVal===undefined?'.'+String(el.className).trim().split(/\s+/).join('.'):'')+' → right '+Math.round(r.right)+' w '+Math.round(r.width)); }
          }
        });
        lines.push('<div>'+(bad.slice(0,12).join('<br>')||'(no leaf culprit)')+'</div>');
      }
      f.remove(); step(i+1);
    },2200);
  };
}
step(0);
</script></body></html>
