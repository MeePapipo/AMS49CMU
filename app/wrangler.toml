name = "ams49-reunion"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# ---------------------------------------------------------------------------
# D1 — ฐานข้อมูลรายการบริจาค/สั่งเสื้อ
# ตอน dev ใช้ฐานจำลองในเครื่อง (.wrangler/state) ไม่ต้องมี database_id จริง
# ตอน deploy จริงต้องรัน  wrangler d1 create ams49  แล้วเอา id ที่ได้มาใส่ตรงนี้
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ams49"
database_id = "8d8f3d1b-3b10-4537-aecb-34a3b263ffde"

# ---------------------------------------------------------------------------
# Workers KV — ที่เก็บไฟล์สลิป
#
# ทำไมใช้ KV ไม่ใช่ R2 ทั้งที่ R2 เหมาะกับไฟล์มากกว่า:
# การเปิดใช้ R2 ครั้งแรกต้องผูกบัตรกับ Cloudflare (แม้ 10 GB แรกจะฟรี)
# ผู้จัดงานไม่ต้องการผูกบัตร จึงย้ายมา KV ซึ่งอยู่ในแผนฟรีของ Workers อยู่แล้ว
#
# ข้อจำกัดที่ต้องรู้ (แผนฟรี)
#   พื้นที่รวม 1 GB · ไฟล์ละไม่เกิน 25 MB · เขียน 1,000 ครั้ง/วัน · อ่าน 100,000 ครั้ง/วัน
#   สลิปจากมือถือปกติ 100–500 KB → เก็บได้ราว 2,000–10,000 ใบ เกินพอสำหรับรุ่นเดียว
#   ถ้าวันหนึ่งพื้นที่ใกล้เต็ม ให้ไล่กด "ลบข้อมูลส่วนบุคคล" ของรายการที่ปิดจบแล้ว
#
# KV เป็น eventually consistent — เขียนแล้วอาจใช้เวลาถึง ~60 วินาทีกว่าจะอ่านได้ทุก region
# ไม่มีผลกับงานนี้ เพราะกรรมการเปิดดูสลิปทีหลังเป็นนาทีหรือชั่วโมง ไม่ใช่ทันทีที่อัปโหลด
#
# **namespace นี้ต้องไม่ถูกเปิดให้เข้าถึงจากภายนอก** ไฟล์เสิร์ฟผ่าน /api/admin/slip/:ref เท่านั้น
# สร้างด้วย  wrangler kv namespace create SLIPS
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "SLIPS"
id = "db7d8286a77e4a52871febcba0ba5261"

# ---------------------------------------------------------------------------
# ค่าที่ไม่ใช่ความลับ — แก้ได้ตรงนี้ทั้งไฟล์เดียว
# ความลับ (SESSION_SECRET / ADMIN_USERS / TURNSTILE_SECRET) อยู่ใน .dev.vars ตอน dev
# และตั้งด้วย  wrangler pages secret put <ชื่อ>  ตอนขึ้นจริง
# ---------------------------------------------------------------------------
[vars]
# เปิด/ปิด Turnstile (กันบอทกดส่ง) — ตั้ง "1" เมื่อใส่คีย์จริงแล้ว
TURNSTILE_ENABLED = "0"
TURNSTILE_SITE_KEY = ""

# Cloudflare Access — ชั้นล็อกก่อนถึง /api/admin/* (ไม่บังคับ)
# เว้นว่าง = ปิด · ใส่ค่าเมื่อไรระบบจะบังคับให้ผ่าน Access ก่อนเสมอ
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ACCESS_EMAILS = ""

# ประกาศบนหน้าเว็บ
GOAL_AMOUNT = "500000"
EVENT_DATE = "2026-11-21"
