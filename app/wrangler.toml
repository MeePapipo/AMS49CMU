name = "ams49-reunion"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# ---------------------------------------------------------------------------
# D1 — ฐานข้อมูลรายการบริจาค/สั่งเสื้อ
# ตอน dev ใช้ฐานจำลองในเครื่อง (.wrangler/state) ไม่ต้องมี database_id จริง
# ตอน deploy จริงต้องรัน  wrangler d1 create ams49  แล้วเอา id ที่ได้มาใส่ตรงนี้
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ams49"
database_id = "00000000-0000-0000-0000-000000000000"

# ---------------------------------------------------------------------------
# R2 — ที่เก็บไฟล์สลิป
# bucket นี้ต้อง "ไม่ public" ตลอดกาล — ไฟล์เสิร์ฟผ่าน /api/admin/slip/:ref เท่านั้น
# สร้างด้วย  wrangler r2 bucket create ams49-slips
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "SLIPS"
bucket_name = "ams49-slips"

# ---------------------------------------------------------------------------
# ค่าที่ไม่ใช่ความลับ — แก้ได้ตรงนี้ทั้งไฟล์เดียว
# ความลับ (SESSION_SECRET / ADMIN_USERS / TURNSTILE_SECRET) อยู่ใน .dev.vars ตอน dev
# และตั้งด้วย  wrangler pages secret put <ชื่อ>  ตอนขึ้นจริง
# ---------------------------------------------------------------------------
[vars]
# เปิด/ปิด Turnstile (กันบอทกดส่ง) — ตั้ง "1" เมื่อใส่คีย์จริงแล้ว
TURNSTILE_ENABLED = "0"
TURNSTILE_SITE_KEY = ""

# Cloudflare Access — ชั้นล็อกก่อนถึง /api/admin/* (ไม่บังคับ)
# เว้นว่าง = ปิด · ใส่ค่าเมื่อไรระบบจะบังคับให้ผ่าน Access ก่อนเสมอ
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ACCESS_EMAILS = ""

# ประกาศบนหน้าเว็บ
GOAL_AMOUNT = "500000"
EVENT_DATE = "2026-11-21"
